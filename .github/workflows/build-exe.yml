name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0)"
        default: "v1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install numpy "Pillow>=10.1" "customtkinter>=5.2" pyinstaller

      - name: Build the program
        run: python -m PyInstaller --noconfirm --clean --noconsole --onefile --name COGNIX-ImageLab --icon assets/COGNIX.ico --collect-all customtkinter --hidden-import PIL._tkinter_finder --add-data "assets;assets" main.py

      - uses: actions/upload-artifact@v4
        with:
          name: COGNIX-ImageLab-windows
          path: dist/COGNIX-ImageLab.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: COGNIX Image Lab ${{ inputs.tag }}
          files: dist/COGNIX-ImageLab.exe
